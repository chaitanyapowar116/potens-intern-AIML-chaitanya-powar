services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: potens-backend
    ports:
      - "5000:5000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY:-}
    volumes:
      - .:/app
    restart: unless-stopped

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: potens-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./Frontend:/app
    restart: unless-stopped
